# Outline: fundamentals -> concurrency/HTTP -> database/messaging -> distributed systems.
# Infrastructure and observability join through their explicit prerequisites.
# This is curriculum definition; learner scores and evidence live separately.
schema_version: 1
curriculum_version: 1.1.0
id: software-engineering-learning-lab-v1
title: Backend & Distributed Systems Fundamentals
language: id-ID
created_on: '2026-10-06'
timezone: Asia/Jakarta
revision_notes:
- V1.1 memperjelas assessment dan contoh diagnostic; 38 competency, ID, outcome axes, serta graph prerequisite dipertahankan.
- Proficiency memakai aturan operasional awal, bukan standar empiris; evaluasi kembali setelah ada evidence learner.
competency_count: 38
purpose: Mengembangkan kemampuan engineering independen melalui evidence praktis, debugging, trade-off, dan transfer
  ke sistem baru.
outline:
- order: 1
  block: fundamentals
  focus: Process, thread, memory, filesystem, dan jaringan.
- order: 2
  block: concurrency
  focus: Shared state, synchronization, bounded work, dan cancellation.
- order: 3
  block: web
  focus: HTTP contract dan latency budget.
- order: 4
  block: database
  focus: Integrity, execution, transaction, dan concurrency data.
- order: 5
  block: messaging
  focus: Async lifecycle, Kafka, offset, dan failure recovery.
- order: 6
  block: distributed
  focus: Duplicate, retry, consistency, reliable intent, dan partial failure.
- order: 7
  block: infrastructure-and-observability
  focus: Runtime, container/cluster, dan pembuktian root cause; dapat dipelajari paralel setelah prerequisite siap.
scope:
  learner_context:
  - Backend Kotlin/Spring, JDBC/JPA, Kafka, SQL Server, dan OpenShift sebagai konteks transfer, bukan bukti mastery.
  - Go micro-lab digunakan untuk menampakkan mekanisme; hasil harus bisa ditransfer ke stack kerja.
  entry_assumptions:
  - Mampu membaca program kecil, menjalankan command, dan menulis fungsi sederhana. Jika belum terbukti, lakukan
    mini-diagnostic dengan scaffold.
  language_policy: Kesulitan sintaks/tooling dicatat terpisah dari competency mekanisme. Boleh menyediakan scaffold
    bahasa tanpa mengerjakan inti lab.
  database_policy: PostgreSQL cocok untuk lab lokal. Perilaku isolation, locking, dan execution plan harus diverifikasi
    lagi pada SQL Server.
  lab_environment: Instructor boleh menyiapkan dependency, fixture, dan harness. Kompetensi Docker tidak menjadi
    prerequisite wajib semua lab broker/database.
  excluded_v1:
  - Bahasa/algoritma sebagai kurikulum tersendiri.
  - TLS, security/auth, frontend, dan CI/CD mendalam.
  - Advanced Kafka internals, consensus implementation, dan Kubernetes administration.
schema_contract:
  competency_id: Key stabil berupa domain.subdomain; gunakan ID yang sama pada lab.yaml dan competency-state.yaml.
  prerequisites: Edge langsung wajib untuk lab mandiri normal; prerequisite transitif diturunkan dari graph. Bukan
    urutan waktu atau tuntutan mastery penuh.
  recommended_preparation: Pengetahuan pendukung, tidak memblokir sesi dan tidak menjadi edge pada wajib DAG.
  diagnostic_delivery: Metadata instructor. Sajikan gejala, constraint, dan success criteria; jangan menampilkan
    competency ID/title, outcomes, stack hint, atau fokus pemeriksaan yang membocorkan mekanisme target pada blind
    diagnostic. Nama stack boleh diberikan bila diperlukan untuk menjalankan task.
  stage: Kisaran kompleksitas integrasi 1-5; bukan skor learner dan bukan urutan wajib.
  goal_relevance: Bobot editorial 1-3. Semua node V1 dipilih relevan tinggi; override di learner/goals bila prioritas
    berubah.
  outcomes: Target perilaku yang dapat diamati pada lima axis; bukan skor dan bukan pertanyaan beserta solusi.
  diagnostic: Contoh task adaptif, bukan lab/environment yang sudah dibuat. Durasi perkiraan disesuaikan scope dan
    kondisi learner.
assessment_policy:
  state_file: learner/competency-state.yaml
  axes:
  - concept
  - implementation
  - debugging
  - judgment
  - transfer
  initial_state:
    scores:
      concept: null
      implementation: null
      debugging: null
      judgment: null
      transfer: null
    confidence: none
    proficiency: unseen
    review_due: false
    evidence: []
  scale:
    '0': Sudah diuji, mekanisme dasar belum dapat didemonstrasikan.
    '1': Dapat mengenali atau menjelaskan fragmen dengan bantuan signifikan.
    '2': Dapat menerapkan pada kasus standar dengan guidance.
    '3': Dapat melakukan secara independen pada kasus representatif.
    '4': Evidence independen yang beragam, termasuk transfer dan retest tertunda.
    unassessed: 'null: belum diuji; jangan diasumsikan lemah atau kuat.'
  hint_policy:
    levels:
      H0: Tanpa hint.
      H1: Pertanyaan klarifikasi netral yang tidak mengarahkan ke konsep, lokasi fault, atau solusi.
      H2: Hint konsep.
      H3: Arah lokasi/subsystem.
      H4: Penjelasan konsep yang hilang.
      H5: Pseudocode atau sebagian approach.
      H6: Solusi penuh.
    record: Catat bantuan per axis; scaffold environment terpisah dari hint penyelesaian.
    prompt_assistance: Petunjuk dalam prompt, scaffold yang mengerjakan mekanisme target, dan penjelasan sebelum
      attempt termasuk bantuan pada axis terdampak. H0 bukan sekadar belum meminta hint tambahan; nilai bantuan
      menurut isinya. Penamaan teknik boleh untuk latihan implementasi terarah, tetapi bukan bukti bahwa learner
      memilih teknik atau menemukan root cause sendiri.
    independence: Bukti yang memerlukan hint konsep H2 atau lebih tidak membuktikan aplikasi independen pada bagian
      yang dibantu. Jadwalkan retest H0/H1.
  evidence_fields:
  - session_id
  - date
  - competency_id
  - axis
  - task_variant
  - artifact_or_observation
  - result
  - max_hint
  - reasoning_check
  optional_evidence_fields:
  - assessment_status
  - prompt_context
  - retest_of
  observation_policy:
    statuses:
      assessed: Ada observasi yang cukup untuk menilai axis tertentu, termasuk attempt yang gagal.
      not_observed: Axis tidak diuji atau bukti belum cukup.
      blocked: Tooling, environment, waktu, atau prerequisite menghalangi observasi yang valid.
    score_updates: Hanya assessed dapat memperbarui skor. not_observed/blocked mempertahankan skor sebelumnya;
      jika belum ada skor, tetap null. Skor 0 perlu bukti ketidakmampuan pada axis yang diuji, bukan sekadar timeout
      sesi, error setup, atau test merah. Keberhasilan kode hasil solusi penuh juga tidak membuktikan kemampuan learner.
    attribution: Nilai hanya perilaku learner yang teramati; pisahkan correctness artefak, reasoning, dan bantuan.
      Satu perubahan constraint belum otomatis membuktikan transfer bila hanya mengganti angka atau nama.
    history: Append evidence dan catat alasan perubahan skor beserta reference evidence; jangan menimpa observasi lama.
      Skor saat ini ditinjau dari bukti relevan, bukan nilai maksimum historis atau rata-rata otomatis semua attempt.
  proficiency_rules:
    status: Aturan operasional V1.1 yang perlu dikalibrasi setelah diagnostic; bukan ukuran ilmiah tervalidasi.
    evaluation: Pilih tingkat tertinggi yang seluruh syaratnya terpenuhi. null tidak memenuhi ambang numerik;
      weighted_ranking tidak digunakan untuk promosi dan prerequisite_gate tetap memakai axis yang relevan.
    unseen: Semua axis null; belum ada observasi yang dapat dinilai.
    learning: Minimal satu axis telah dinilai, tetapi syarat functional belum terpenuhi.
    functional: Concept, implementation, dan debugging masing-masing minimal 2 dengan evidence relevan;
      judgment dan transfer boleh belum diuji. Label ini belum menyatakan kemandirian penuh.
    proficient: Seluruh lima axis minimal 3, confidence medium atau high, serta bukti independen pada lebih dari
      satu task_variant dan tanggal. Terapkan hint_policy pada setiap axis.
    mastered: Seluruh lima axis 4, confidence high, dan evidence independen lintas variasi/tanggal yang mencakup
      successful delayed retrieval serta transfer ke situasi baru. Satu keberhasilan tidak cukup.
    reassessment: Saat ada evidence valid baru, tinjau ulang skor dan proficiency dengan alasan tercatat;
      review_due sendiri tidak menurunkan proficiency atau menghapus history.
  promotion: Satu lab menghasilkan observasi, bukan mastery. Kenaikan ke 3 membutuhkan bukti independen; 4 membutuhkan
    variasi problem dan successful delayed transfer/retrieval.
  confidence:
    none: Belum ada evidence.
    low: Evidence sedikit atau terbatas pada satu jenis tugas.
    medium: Beberapa evidence pada lebih dari satu jenis tugas dan tanggal.
    high: Evidence independen lintas jenis/tanggal, termasuk retest tertunda dan transfer.
  weighted_ranking:
    weights:
      concept: 0.2
      implementation: 0.25
      debugging: 0.25
      judgment: 0.2
      transfer: 0.1
    rule: Hitung hanya ketika seluruh axis sudah diuji. Jika ada null, skor agregat tetap null; prioritaskan diagnosis
      axis kosong. Angka agregat untuk ranking, bukan klaim persentase kemampuan.
  review_policy: Proficiency dan review_due disimpan terpisah. Melewati tanggal review tidak menghapus evidence
    mastery; kegagalan retest menghasilkan evidence baru.
  spaced_retrieval:
    suggested_days_after_success:
    - 2
    - 7
    - 21
    - 60
    rule: Interval merupakan default operasional, bukan formula ilmiah atau jadwal otomatis. Pendekkan setelah bantuan
      besar/gagal; sesuaikan ketersediaan dan hasil retest.
selection_policy:
  first_session: Lakukan initial diagnostic secara sampling pada beberapa target bernilai tinggi, bukan seluruh
    38 node sekaligus. Jangan mengisi skor berdasarkan pengalaman kerja atau riwayat tanya jawab.
  diagnostic_timebox: suggested_minutes adalah timebox probe pada environment siap, bukan janji menyelesaikan
    seluruh outcome atau lima axis. Pilih satu atau dua axis utama; pecah task integrasi bila scope terlalu besar.
    Catat waktu setup terpisah dan gunakan not_observed/blocked jika observasi belum memadai.
  reasoning_from_first_lab: Hipotesis sebelum perubahan, evidence pembeda, dan satu variabel eksperimen diterapkan
    sejak lab awal. Gate observability.incident-reasoning berlaku untuk lab instrumentasi/integrasi mandiri penuh,
    bukan untuk kebiasaan debugging dasar. Gunakan stdout, exit status, timing, atau fixture sederhana sesuai task;
    nilai hanya axis/node yang benar-benar teramati.
  prerequisite_gate:
    default_axes:
      concept: 2
      implementation: 2
    evidence_required: Minimal satu evidence relevan untuk tiap prerequisite langsung; lab.yaml boleh menyempitkan
      axis yang relevan.
    unknown: 'Prerequisite belum diuji: lakukan probe singkat sebelum memutuskan remediation.'
    not_ready: Pilih mini-lab prerequisite atau guided preview; jangan memaksa lab integrasi mandiri.
    diagnostic_exception: Diagnostic boleh menguji lintas node tanpa gate, tetapi hasil per axis harus diatribusikan
      ke evidence aktual.
  priority_order:
  - Selesaikan lab aktif atau recovery environment yang menghambat.
  - Probe prerequisite yang belum diketahui atau remediasi gap yang benar-benar menghambat target.
  - Retrieval yang jatuh tempo, terutama competency relevan dengan evidence rapuh.
  - Mistake pattern berulang dan axis debugging/implementation yang lemah.
  - Competency penting yang belum memiliki evidence.
  - Transfer atau integrasi setelah dasar terbukti.
  difficulty: Naikkan atau turunkan satu tingkat berdasarkan beberapa evidence. Jangan memperlakukan estimasi peluang
    sukses 70-85% sebagai angka terukur tanpa data.
  task_sampling: Variasikan implementasi, debugging, desain, dan retrieval. Satu task boleh menguji beberapa node
    tetapi tidak semua axis harus diberi skor.
  maintenance: Pertahankan ID. Bila node dipecah pada V2, migrasikan evidence secara eksplisit; jangan menyalin
    mastery parent ke semua child.
competencies:
  os.processes:
    title: Proses, lifecycle, dan exit status
    domain: fundamentals
    stage: 1
    goal_relevance: 3
    prerequisites: []
    recommended_preparation: []
    outcomes:
      concept: Menjelaskan PID, parent process, environment, signal, dan exit status.
      implementation: Menjalankan proses, mengirim signal, menangkap exit status, dan membuat shutdown terkontrol.
      debugging: Menggunakan bukti runtime untuk membedakan crash, kill, dan kegagalan startup.
      judgment: Memilih graceful shutdown atau force termination berdasarkan pekerjaan yang sedang berjalan.
      transfer: Menghubungkan penghentian proses dengan shutdown service JVM tanpa menyimpulkan penyebab hanya dari
        exit code.
    diagnostic:
      task: Service berhenti tiba-tiba; tentukan apakah selesai normal, menerima signal, atau gagal saat startup.
      stack: Linux CLI + program kecil Go
      initial_hint: H0
      evidence:
      - Hipotesis atau prediksi sebelum eksperimen.
      - Perintah, kode, hasil observasi, dan penjelasan hubungan sebab-akibat.
      - Satu perubahan constraint untuk memeriksa transfer.
      suggested_minutes: 30
  os.threads:
    title: Thread, goroutine, dan scheduling
    domain: fundamentals
    stage: 1
    goal_relevance: 3
    prerequisites:
    - os.processes
    recommended_preparation: []
    outcomes:
      concept: Membedakan proses, OS thread, goroutine, concurrency, dan parallelism.
      implementation: Membuat beberapa task concurrent dan mengukur waktu wall-clock serta CPU.
      debugging: Mengidentifikasi blocking atau antrean task dengan bukti, bukan hanya jumlah thread.
      judgment: Memilih execution model untuk beban CPU-bound dan I/O-bound.
      transfer: Menjelaskan mengapa goroutine tidak identik dengan thread atau virtual thread JVM.
    diagnostic:
      task: Bandingkan task yang menunggu I/O dengan task yang menghitung; amati concurrency dan penggunaan CPU.
      stack: Go; transfer ke Java executor
      initial_hint: H0
      evidence:
      - Hipotesis atau prediksi sebelum eksperimen.
      - Perintah, kode, hasil observasi, dan penjelasan hubungan sebab-akibat.
      - Satu perubahan constraint untuk memeriksa transfer.
      suggested_minutes: 30
  os.memory:
    title: Heap, stack, allocation, dan lifetime
    domain: fundamentals
    stage: 1
    goal_relevance: 3
    prerequisites:
    - os.processes
    recommended_preparation: []
    outcomes:
      concept: Membedakan lifetime objek, stack, heap, garbage collection, dan memori proses.
      implementation: Mengukur allocation dan penggunaan memori pada program kecil.
      debugging: Membedakan allocation tinggi dari retention menggunakan profil atau eksperimen.
      judgment: Menimbang reuse objek, keterbacaan, dan optimasi berdasarkan hasil pengukuran.
      transfer: Menggunakan reasoning lifetime pada service JVM dengan model runtime yang berbeda.
    diagnostic:
      task: Program memori bertumbuh walau request selesai; ukur allocation dan objek yang masih direferensikan.
      stack: Go benchmark/profiling; transfer ke JVM
      initial_hint: H0
      evidence:
      - Hipotesis atau prediksi sebelum eksperimen.
      - Perintah, kode, hasil observasi, dan penjelasan hubungan sebab-akibat.
      - Satu perubahan constraint untuk memeriksa transfer.
      suggested_minutes: 30
  os.files-and-descriptors:
    title: File, path, permission, dan descriptor
    domain: fundamentals
    stage: 1
    goal_relevance: 3
    prerequisites:
    - os.processes
    recommended_preparation: []
    outcomes:
      concept: Menjelaskan path relatif, working directory, permission, dan file descriptor.
      implementation: Membuka dan menutup file dengan aman serta mengatur permission minimum.
      debugging: Mendiagnosis file-not-found, permission-denied, atau descriptor exhaustion dari bukti.
      judgment: Menimbang buffering, flush, dan kebutuhan durability tanpa menganggap write selalu sudah persisten.
      transfer: Menghubungkan resource leak file dengan lifecycle socket atau koneksi database.
    diagnostic:
      task: Service gagal menulis file atau membuka koneksi baru. Reproduksi gejala, ajukan hipotesis, dan
        buktikan penyebab sebelum memperbaikinya.
      stack: Linux CLI + Go
      initial_hint: H0
      evidence:
      - Hipotesis atau prediksi sebelum eksperimen.
      - Perintah, kode, hasil observasi, dan penjelasan hubungan sebab-akibat.
      - Satu perubahan constraint untuk memeriksa transfer.
      suggested_minutes: 30
  network.sockets:
    title: Socket, bind, listen, dan address
    domain: fundamentals
    stage: 1
    goal_relevance: 3
    prerequisites:
    - os.processes
    - os.files-and-descriptors
    recommended_preparation: []
    outcomes:
      concept: Menjelaskan socket, local/remote endpoint, bind, listen, dan accept.
      implementation: Membuat server-client kecil serta memilih bind address secara sengaja.
      debugging: Membedakan tidak ada listener, address keliru, port bentrok, dan jalur akses terblokir.
      judgment: Menentukan exposure service berdasarkan kebutuhan akses.
      transfer: Menerapkan reasoning endpoint pada koneksi service di dalam container.
    diagnostic:
      task: Server dilaporkan hidup tetapi tidak dapat diakses dari host lain. Tentukan penyebab menggunakan
        eksperimen pembeda dan pulihkan akses sesuai constraint.
      stack: Go TCP server + CLI jaringan
      initial_hint: H0
      evidence:
      - Hipotesis atau prediksi sebelum eksperimen.
      - Perintah, kode, hasil observasi, dan penjelasan hubungan sebab-akibat.
      - Satu perubahan constraint untuk memeriksa transfer.
      suggested_minutes: 30
  network.tcp:
    title: TCP stream, framing, dan connection lifecycle
    domain: fundamentals
    stage: 1
    goal_relevance: 3
    prerequisites:
    - network.sockets
    recommended_preparation: []
    outcomes:
      concept: Menjelaskan reliable byte stream, handshake, close, dan ketiadaan batas pesan aplikasi.
      implementation: Menerapkan framing dan menangani partial read/write serta EOF.
      debugging: Mereproduksi bug yang menganggap satu read sama dengan satu pesan.
      judgment: Memilih framing length-prefix atau delimiter sesuai payload dan batas ukuran.
      transfer: Menghubungkan timeout atau connection reset dengan bukti pada lifecycle koneksi.
    diagnostic:
      task: Client menerima pesan terpotong atau dua pesan sekaligus; rancang pembacaan stream yang benar.
      stack: Go TCP client/server
      initial_hint: H0
      evidence:
      - Hipotesis atau prediksi sebelum eksperimen.
      - Perintah, kode, hasil observasi, dan penjelasan hubungan sebab-akibat.
      - Satu perubahan constraint untuk memeriksa transfer.
      suggested_minutes: 30
  network.dns:
    title: DNS dan resolusi nama service
    domain: fundamentals
    stage: 1
    goal_relevance: 3
    prerequisites:
    - network.sockets
    recommended_preparation: []
    outcomes:
      concept: Membedakan resolusi nama, koneksi transport, dan routing HTTP.
      implementation: Menguji lookup hostname dan menghubungkannya dengan endpoint tujuan.
      debugging: Membedakan kegagalan DNS dari kegagalan koneksi atau service tujuan.
      judgment: Menimbang caching DNS, TTL, dan perubahan alamat service.
      transfer: Mendiagnosis hostname service yang berbeda antara host, container, dan cluster.
    diagnostic:
      task: Akses memakai IP berhasil tetapi hostname gagal. Jelaskan kemungkinan penyebab dan buktikan mana
        yang sesuai observasi.
      stack: Linux resolver tools + HTTP client
      initial_hint: H0
      evidence:
      - Hipotesis atau prediksi sebelum eksperimen.
      - Perintah, kode, hasil observasi, dan penjelasan hubungan sebab-akibat.
      - Satu perubahan constraint untuk memeriksa transfer.
      suggested_minutes: 30
  concurrency.shared-state:
    title: Shared state dan race condition
    domain: concurrency
    stage: 1
    goal_relevance: 3
    prerequisites:
    - os.threads
    - os.memory
    recommended_preparation: []
    outcomes:
      concept: Menjelaskan data race dan logical race melalui contoh interleaving.
      implementation: Membuat reproduksi concurrent yang memperlihatkan invariant rusak.
      debugging: Menggunakan detector dan stress test sebagai evidence dengan memahami batasnya.
      judgment: Membedakan shared mutable state dari state yang dimiliki satu worker.
      transfer: Mendeteksi check-then-act race yang bisa terjadi walau akses individual tersinkronisasi.
    diagnostic:
      task: Counter request memberikan hasil berbeda setiap run; buat reproduksi dan identifikasi interleaving.
      stack: Go race detector; transfer ke Kotlin singleton
      initial_hint: H0
      evidence:
      - Hipotesis atau prediksi sebelum eksperimen.
      - Perintah, kode, hasil observasi, dan penjelasan hubungan sebab-akibat.
      - Satu perubahan constraint untuk memeriksa transfer.
      suggested_minutes: 30
  concurrency.synchronization:
    title: Synchronization dan invariant
    domain: concurrency
    stage: 1
    goal_relevance: 3
    prerequisites:
    - concurrency.shared-state
    recommended_preparation: []
    outcomes:
      concept: Menjelaskan critical section, visibility, dan invariant yang harus dijaga.
      implementation: Menggunakan lock atau ownership message untuk menjaga invariant.
      debugging: Mendiagnosis lock scope salah atau interleaving yang masih merusak state.
      judgment: Memilih mutex, atomic operation, atau ownership berdasarkan invariant.
      transfer: Menerapkan reasoning yang sama pada struktur data atau alur request baru.
    diagnostic:
      task: Lindungi operasi multi-step tanpa membuat seluruh service terserialisasi.
      stack: Go mutex/channel; transfer ke Java
      initial_hint: H0
      evidence:
      - Hipotesis atau prediksi sebelum eksperimen.
      - Perintah, kode, hasil observasi, dan penjelasan hubungan sebab-akibat.
      - Satu perubahan constraint untuk memeriksa transfer.
      suggested_minutes: 30
  concurrency.worker-pools:
    title: Worker pool, bounded queue, dan backpressure
    domain: concurrency
    stage: 2
    goal_relevance: 3
    prerequisites:
    - concurrency.synchronization
    recommended_preparation:
    - os.memory
    outcomes:
      concept: Menjelaskan hubungan arrival rate, throughput, queue growth, dan batas concurrency.
      implementation: Membuat worker pool dengan antrean terbatas serta overload policy.
      debugging: Mengidentifikasi bottleneck melalui queue depth, latency, dan utilization.
      judgment: Menimbang blocking, rejection, dan load shedding saat kapasitas penuh.
      transfer: Menghubungkan worker limit dengan ukuran DB pool dan beban downstream.
    diagnostic:
      task: Saat request burst, latency dan memori terus meningkat. Tentukan bottleneck dan perbaiki
        perilaku overload dengan resource yang dibatasi.
      stack: Go worker pool
      initial_hint: H0
      evidence:
      - Hipotesis atau prediksi sebelum eksperimen.
      - Perintah, kode, hasil observasi, dan penjelasan hubungan sebab-akibat.
      - Satu perubahan constraint untuk memeriksa transfer.
      suggested_minutes: 30
  concurrency.cancellation:
    title: Cancellation, deadline, dan cleanup
    domain: concurrency
    stage: 2
    goal_relevance: 3
    prerequisites:
    - os.threads
    - os.files-and-descriptors
    recommended_preparation:
    - concurrency.worker-pools
    outcomes:
      concept: Membedakan cancellation kooperatif, deadline, dan penghentian paksa.
      implementation: Meneruskan cancellation dan menutup resource pada jalur sukses maupun gagal.
      debugging: Mendeteksi worker yang tertinggal atau cleanup yang tidak terjadi.
      judgment: Menetapkan ownership cancellation dan batas waktu operasi.
      transfer: Menerapkan cancellation pada request yang memanggil beberapa dependency.
    diagnostic:
      task: Pemanggil membatalkan pekerjaan tetapi penggunaan resource tidak kembali seperti semula.
        Reproduksi, buktikan penyebab, dan perbaiki lifecycle pekerjaan.
      stack: Go context; transfer ke JVM cancellation
      initial_hint: H0
      evidence:
      - Hipotesis atau prediksi sebelum eksperimen.
      - Perintah, kode, hasil observasi, dan penjelasan hubungan sebab-akibat.
      - Satu perubahan constraint untuk memeriksa transfer.
      suggested_minutes: 30
  web.http-semantics:
    title: HTTP request, response, dan contract
    domain: web
    stage: 2
    goal_relevance: 3
    prerequisites:
    - network.tcp
    recommended_preparation:
    - network.dns
    outcomes:
      concept: Menjelaskan method, status, header, body, dan idempotency pada contract HTTP.
