# Competency State V1 — data learner, bukan definisi kurikulum.
# Outline: metadata -> pointer pekerjaan -> 38 competency -> evidence -> assessment history -> review plan.
# Seluruh state awal belum dinilai. Tidak ada sesi, attempt, atau evidence nyata yang diisi.
# Aturan skor/proficiency/hint: curriculum/competency-map.yaml.
# Prosedur: docs/learning-system.md, docs/evaluation-rubric.md, docs/adaptive-learning.md.
#
# KONTRAK FIELD (komentar ini bukan record learner):
# - schema_version adalah versi struktur file ini; berbeda dari curriculum_version.
# - initialized_on/updated_on adalah tanggal administrasi file, bukan tanggal assessment.
# - last_session_id menunjuk sesi nyata terakhir yang tercatat, atau null.
# - last_applied_checkpoint menunjuk checkpoint yang sudah diterapkan pada state ini,
#   bukan jaminan seluruh file history/artefak sudah tersimpan konsisten.
# - active_work: null, atau object lab_id, task_variant, attempt_id, session_id,
#   checkpoint_id, checkpoint_reference, next_step. ID aktif harus berasal dari task nyata.
# - competencies: key persis sama dengan ID dalam map; jangan mengganti atau menambah ID sendiri.
# - scores: lima axis; hanya null atau integer 0–4. Tidak ada evidence berarti null.
# - confidence/proficiency mengikuti map; tidak diturunkan hanya dari rata-rata skor.
# - weighted_score: derived dari bobot map; null jika masih ada axis null.
# - last_assessed_on: tanggal assessment valid terbaru, atau null.
# - evidence: append-only daftar observasi. Evidence ID unik pada seluruh file.
# - assessment_history: append-only alasan dan before/after perubahan state penilaian.
# - review_plan: daftar review per target axes; satu review tidak mereset review axis lain.
# - review_due: derived; true jika ada review berstatus planned dengan scheduled_date
#   <= tanggal saat ini di Asia/Jakarta. Hitung ulang saat membuka/menyimpan sesi.
#   Tidak ada review terjadwal berarti false. Due tidak otomatis menurunkan proficiency.
#
# BENTUK SETIAP RECORD evidence (buat hanya dari observasi nyata):
#   evidence_id: ID unik YYYY-MM-DD-sNN-eNN
#   session_id: ID sesi asal
#   date: tanggal lokal YYYY-MM-DD (string)
#   lab_id: ID lab nyata (membuat attempt_id yang lokal per lab tidak ambigu)
#   attempt_id: ID attempt dalam lab
#   competency_id: sama dengan competency induk record ini
#   axis: concept | implementation | debugging | judgment | transfer
#   task_variant: ID varian yang sesuai metadata lab
#   assessment_status: assessed | not_observed | blocked
#   artifact_or_observation: ringkasan spesifik dengan path relatif/anchor atau snapshot nyata
#   result: fakta hasil yang teramati, bukan sekadar 'paham' atau 'lulus'
#   max_hint: H0..H6 untuk bagian/axis record ini; null hanya jika tidak dapat ditentukan
#   prompt_context: bantuan/exposure yang relevan, atau null jika tidak diketahui
#   reasoning_check: null, atau object:
#     check_type: prediction | causal_explanation | discriminating_experiment |
#                 constraint_change | boundary_case | transfer | delayed_retrieval
#     prompt: pertanyaan/tugas yang benar-benar diberikan
#     learner_response: jawaban atau ringkasan setia respons aktual
#     observation_reference: lokasi trace/output/notes, atau null jika tidak ada artefak terpisah
#     interpretation: kesimpulan terbatas instructor dari observasi
#     limitations: daftar keterbatasan, bukan asumsi bahwa semua axis sudah terbukti
#   retest_of: evidence_id asal, atau null untuk observasi yang bukan retest
#   correction_of: evidence_id yang dikoreksi, atau null; record asli tetap dipertahankan
#
# Evidence blocked/not_observed tidak boleh mengubah skor; catat hambatan dan pertahankan nilai lama.
# Jika suatu record tidak memuat hint yang dapat diketahui, jangan klaim independence.
# Untuk bantuan yang datang setelah observasi independen, buat record terpisah dengan scope jelas;
# jangan melabeli seluruh attempt sebagai H0. Gunakan reference ke notes untuk urutan kejadian.
#
# BENTUK SETIAP RECORD assessment_history:
#   assessment_id, session_id, checkpoint_id, date, evidence_ids, before, after, rationale
# - before/after berisi field penilaian yang berubah (scores, confidence, proficiency).
# - Perubahan scores dapat memuat hanya axis terdampak. Field lain tidak disentuh.
# - evidence_ids harus menunjuk evidence nyata yang sudah tercatat; koreksi memakai ID baru.
# - Jika skor tidak berubah, evidence tetap disimpan; jangan membuat perubahan buatan.
# - History ini bukan rata-rata nilai attempt dan bukan daftar highest score.
#
# BENTUK SETIAP RECORD review_plan:
#   review_id, anchor_evidence_ids, anchor_date, target_axes, task_type,
#   target_date, scheduled_date, scheduling_reason, status,
#   completed_at, result_evidence_ids, schedule_history
# - Semua ID review unik; anchor mengacu pada evidence belajar/retest nyata.
# - target_date: tanggal acuan interval; scheduled_date: tanggal pelaksanaan yang direncanakan.
# - status: planned | completed | cancelled. Tanggal/hasil aktual awalnya null atau [].
# - schedule_history: daftar perubahan jadwal (changed_on, before, after, reason), awalnya [].
# - Simpan actual completed_at memakai timestamp offset +07:00 ketika review benar-benar terjadi.
# - planned dengan scheduled_date null adalah draft, belum jatuh tempo; lengkapi sebelum menutup sesi.
# - Jangan menandai completed hanya karena learner membuka kembali catatan atau sesi telah berakhir.
#
# Feedback bosan/frustrasi dan calibration_decision berada di notes/session-history,
# bukan pada scores atau confidence. Data contoh dari dokumen tidak boleh dimasukkan ke evidence.
# Jangan menyalin definisi outcome, prerequisite graph, atau bobot map ke setiap node state.
